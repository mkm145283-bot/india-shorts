<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Shorts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #0b0b10, #21101b);
    }
    header {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: bold; }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #ff174f, #ff8a00);
    }
    nav { display: flex; gap: 20px; align-items: center; }
    nav a { color: #ddd; text-decoration: none; }
    .button {
      border: 0; border-radius: 24px; padding: 12px 20px;
      color: white; background: linear-gradient(90deg, #ff174f, #ff7043);
      cursor: pointer; font-weight: bold;
    }
    main {
      max-width: 1100px; min-height: calc(100vh - 80px); margin: auto;
      padding: 50px 20px; display: grid; grid-template-columns: 1fr 360px;
      gap: 60px; align-items: center;
    }
    h1 { font-size: clamp(42px, 7vw, 78px); line-height: 1; margin-bottom: 20px; }
    .lead { max-width: 600px; color: #ccc; font-size: 18px; line-height: 1.6; margin-bottom: 28px; }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .secondary { background: #22232b; border: 1px solid #444; }
    .stats { display: flex; gap: 30px; margin-top: 35px; color: #bbb; }
    .stats strong { display: block; color: white; font-size: 24px; margin-bottom: 4px; }
    .phone {
      height: 600px; padding: 12px; border: 2px solid #444; border-radius: 38px;
      background: #09090b; box-shadow: 0 25px 70px #0008;
    }
    .screen {
      height: 100%; border-radius: 28px; padding: 24px 18px;
      display: flex; align-items: end;
      background: linear-gradient(#0001, #000b), linear-gradient(135deg, #75204e, #164d58);
    }
    .video-info { line-height: 1.6; }
    .video-info h3 { margin-bottom: 8px; }
    .video-info p { color: #eee; }
    @media (max-width: 800px) {
      nav a { display: none; }
      main { grid-template-columns: 1fr; gap: 35px; text-align: center; }
      .actions, .stats { justify-content: center; }
      .phone { width: 280px; margin: auto; height: 520px; }
      .lead { margin-left: auto; margin-right: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">▶</div>India Shorts</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#discover">Discover</a>
      <a href="#about">About</a>
      <button class="button" onclick="startApp()">Start</button>
    </nav>
  </header>

  <main id="home">
    <section>
      <h1>Har second ko share karo.</h1>
      <p class="lead">
        India Shorts par short videos dekhiye, apni creativity share kijiye,
        aur naye creators ke saath connect kijiye.
      </p>
      <div class="actions">
        <button class="button" onclick="startApp()">Get Started</button>
        <button class="button secondary" onclick="watchPreview()">Watch Preview</button>
      </div>
      <div class="stats">
        <div><strong>1M+</strong>Creators</div>
        <div><strong>10M+</strong>Views</div>
        <div><strong>24/7</strong>Trends</div>
      </div>
    </section>

    <section class="phone" aria-label="Video preview">
      <div class="screen">
        <div class="video-info">
          <h3>@india_creator</h3>
          <p>Apni creativity duniya ke saath share karein ✨</p>
          <p>♥ 12.4K &nbsp; 💬 845 &nbsp; ↗ Share</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    function startApp() {
      alert('India Shorts mein aapka swagat hai!');
    }

    function watchPreview() {
      alert('Video preview jaldi available hoga.');
    }
  </script>
</body>
</html>
